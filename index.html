<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Public privacy policies and data-deletion information for Android apps.">
  <meta name="robots" content="index, follow">
  <title>App Privacy Policies</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f5f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #5d687d;
      --border: #dce2ec;
      --accent: #3159c9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 680px); }
    .card {
      padding: clamp(24px, 6vw, 42px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 16px 48px rgb(23 32 51 / 8%);
    }
    .brand { margin: 0 0 8px; color: var(--accent); font-size: 13px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 7vw, 44px); line-height: 1.15; letter-spacing: -.035em; }
    p { margin: 0 0 20px; color: var(--muted); }
    ul { margin: 24px 0 0; padding: 0; list-style: none; }
    li + li { margin-top: 12px; }
    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
    }
    a:hover { border-color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    small { display: block; margin-top: 4px; color: var(--muted); font-weight: 400; }
    @media (prefers-color-scheme: dark) {
      :root { --background: #0b0e14; --surface: #141923; --text: #edf1f8; --muted: #aab4c7; --border: #293243; --accent: #9db3ff; }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="brand">Public policies</p>
      <h1>App Privacy Policies</h1>
      <p>Privacy policies and data-deletion instructions for Android apps published by aesw0x.</p>
      <ul aria-label="Available privacy policies">
        <li>
          <a href="arcplayer/">Arc Player <small>Privacy policy and deletion instructions</small></a>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
